<div class="dashboard-wrapper">

  @if (stats) {
    <!-- KPI Cards -->
    <div class="kpi-row">
      <mat-card class="kpi-card total">
        <mat-icon>payments</mat-icon>
        <div class="kpi-info">
          <span class="kpi-label">Total Spend</span>
          <span class="kpi-value">{{ stats.totalSpend | currency }}</span>
        </div>
      </mat-card>
      <mat-card class="kpi-card invoices">
        <mat-icon>receipt_long</mat-icon>
        <div class="kpi-info">
          <span class="kpi-label">Total Invoices</span>
          <span class="kpi-value">{{ stats.invoiceCount }}</span>
        </div>
      </mat-card>
      <mat-card class="kpi-card anomaly">
        <mat-icon>warning</mat-icon>
        <div class="kpi-info">
          <span class="kpi-label">Anomalies</span>
          <span class="kpi-value">{{ stats.anomalyCount }}</span>
        </div>
      </mat-card>
      <mat-card class="kpi-card actions">
        <mat-icon>add_circle</mat-icon>
        <div class="kpi-info">
          <span class="kpi-label">Quick Actions</span>
          <div class="action-links">
            <a routerLink="/upload">Upload Invoice</a>
            <a routerLink="/chat">Ask AI</a>
          </div>
        </div>
      </mat-card>
    </div>

    <!-- Charts Row -->
    <div class="charts-row">
      <mat-card class="chart-card">
        <mat-card-header>
          <mat-card-title>Spend by Category</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <canvas id="categoryChart"></canvas>
        </mat-card-content>
      </mat-card>

      <mat-card class="chart-card">
        <mat-card-header>
          <mat-card-title>Invoice Status</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <canvas id="statusChart"></canvas>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- Vendor Bar Chart -->
    <mat-card class="chart-card full">
      <mat-card-header>
        <mat-card-title>Spend by Vendor</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas id="vendorChart"></canvas>
      </mat-card-content>
    </mat-card>
  }

</div>
